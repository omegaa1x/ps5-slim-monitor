[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ps5-slim-monitor"
version = "1.0.0"
description = "Monitor de ofertas PS5 Slim (España) con avisos por Telegram"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
ps5monitor = "ps5monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long user-facing message strings are kept on one line for readability

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
